[project]
name = "eduplanner_demo"
authors = [
	{name = "Pallasys", email = "hello@necode.it"},
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"pyyaml>=6,<7",
	"rich>=13,<15",
]
keywords = ["moodle"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/necodeIT/eduplanner_demo"
Repository = "https://github.com/necodeIT/eduplanner_demo.git"
Issues = "https://github.com/necodeIT/eduplanner_demo/issues"

[project.scripts]
demo = "eduplanner_demo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "eduplanner_demo.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
