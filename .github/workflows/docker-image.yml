name: Build Docker Image
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      lbplanner_ref:
        description: LB Planner release tag, branch, or full commit SHA
        required: false
        default: main

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
        steps:

          - name: Checkout demo
            uses: actions/checkout@v4

          - name: 🐳 Login to GitHub Container Registry
            uses: docker/login-action@v3.3.0
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}
  
          - name: 🐳 Build and Push
            uses: docker/build-push-action@v6.10.0
            with:
              context: .
              file: ./Dockerfile
              build-args: |
                LBPLANNER_REF=${{ inputs.lbplanner_ref || 'main' }}
              build-contexts: |
                lbplanner=https://github.com/necodeIT/lb_planner_plugin.git#${{ inputs.lbplanner_ref || 'main' }}
              platforms: linux/amd64
              push: true
              tags: ghcr.io/necodeit/eduplanner_demo:latest
